# Server configuration
server.port=3000

# Database configuration (Embedded Persistent H2 Database - Zero Setup, Runs Everywhere)
spring.datasource.url=jdbc:h2:file:./data/barbereasedb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT settings
jwt.secret=your_secure_jwt_secret
jwt.expiration-ms=86400000

# Jackson snake_case serialization configuration
spring.jackson.property-naming-strategy=SNAKE_CASE

# Custom app properties
app.reservation-timeout-ms=300000
app.auto-open-browser=false

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
